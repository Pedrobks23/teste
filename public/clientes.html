<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Clientes</title>
<style>
body { font-family: sans-serif; margin: 20px; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #ccc; padding: 4px; }
</style>
</head>
<body>
<h1>Clientes</h1>
<table id="lista"></table>
<h2>Novo Cliente</h2>
<form id="clienteForm">
  <label>Nome: <input type="text" id="nome" required></label>
  <label>Telefone: <input type="text" id="telefone"></label>
  <label>Email: <input type="email" id="email"></label>
  <button type="submit">Salvar</button>
</form>
<p id="msg"></p>
<script>
async function carregar() {
  const res = await fetch('/clientes');
  const dados = await res.json();
  const tabela = document.getElementById('lista');
  tabela.innerHTML = '<tr><th>ID</th><th>Nome</th><th>Telefone</th><th>Email</th></tr>' +
    dados.map(c => `<tr><td>${c.id}</td><td>${c.nome}</td><td>${c.telefone}</td><td>${c.email}</td></tr>`).join('');
}
carregar();

document.getElementById('clienteForm').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {
    nome: document.getElementById('nome').value,
    telefone: document.getElementById('telefone').value,
    email: document.getElementById('email').value
  };
  const res = await fetch('/clientes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const msg = document.getElementById('msg');
  if (res.ok) {
    msg.textContent = 'Cliente cadastrado';
    carregar();
  } else {
    const data = await res.json();
    msg.textContent = data.error || 'Erro';
  }
});
</script>
<p><a href="index.html">Nova Reserva</a></p>
</body>
</html>
